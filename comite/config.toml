# Comité de qca-causal-cones — motor común en ~/herramientas/skills/comite.
# Cada [[rol]] elige un arquetipo del catálogo común; su ancla específica del
# proyecto está en comite/roles/<id>.md.

proyecto = "qca-causal-cones"
idioma = "español"
salida = "reports/comite"
contexto = "comite/contexto.md"

# Derivados de PROJECT_INSTRUCTIONS.md §§1-7.
guardarrailes = [
  "NO_UNQUALIFIED_VMAX — nunca v_max sin cualificar; C_micro, V_causal^max, V_grp^max y c_IR son distintos (§3)",
  "NO_EVIDENCE_PROMOTION — nada sube de PRELIMINARY a ESTABLISHED por encajar en la narrativa (§4)",
  "NO_RIGIDITY_FROM_FINITE_SCAN — una búsqueda fallida, un barrido finito o un aislamiento local no prueban rigidez (§7)",
  "NO_UNCHARTERED_GATE — sólo se trabaja en gates autorizados en state/CURRENT_STATE.md (§§2, 7)",
  "NO_SCOPE_BROADENING — nada de causal sets, redes aleatorias, gravedad cuántica ni nuevas clases de sustrato; QCA interactuantes sólo para la pregunta de coexistencia, un modelo, código y conjunto de recursos declarados por contrato (§1)",
  "NO_NOVELTY_WITHOUT_PRIOR_ART — Bernstein y su teoría de igualdad son prior art; la novedad sigue OPEN (§6)",
  "KEEP_QUANTIFIERS — dimensión interna, grupo/acción, representación, nodo/sector e irreducibilidad se congelan antes y se conservan en toda conclusión (§7)",
]

